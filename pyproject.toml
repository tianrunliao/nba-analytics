[project]
name = "nba-dynamic-sos"
version = "0.1.0"
description = "NBA dynamic strength-of-schedule prediction system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nba_api==1.12.0",
    "pandas>=2.2,<3",
    "numpy>=2",
    "pyarrow>=20",
    "scipy>=1.15",
    "pdfplumber>=0.11",
    "timezonefinder>=6.5",
    "pyyaml>=6",
    "requests>=2.32",
    "catboost>=1.2.10",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_sos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes / pycodestyle errors, import order, bugbear, pyupgrade; long lines are not enforced
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# zip(strict=) everywhere would be a broad mechanical change; lengths are checked where it matters
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# closures that read loop variables are called within the same iteration (tie-break helpers)
"src/nba_sos/sos/cup.py" = ["B023"]
"src/nba_sos/ratings/playoff_model.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
files = ["src/nba_sos"]
ignore_missing_imports = true
