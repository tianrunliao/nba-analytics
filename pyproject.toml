[project]
name = "nba-dynamic-sos"
version = "0.1.0"
description = "NBA dynamic strength-of-schedule prediction system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nba_api==1.12.0",
    "pandas>=2.2,<3",
    "numpy>=2",
    "pyarrow>=20",
    "scipy>=1.15",
    "pdfplumber>=0.11",
    "timezonefinder>=6.5",
    "pyyaml>=6",
    "requests>=2.32",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_sos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access (deselected by default)"]
addopts = "-m 'not network'"
