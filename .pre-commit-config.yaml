repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # reports/ holds generated outputs; they must stay byte-identical to what the code writes
        exclude: ^reports/
      - id: check-added-large-files
        args: [--maxkb=1024]
